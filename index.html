<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор озвучиваемой статьи</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; max-width: 800px; }
        #status { margin-top: 15px; color: #555; line-height: 1.5; }
        [hidden] { display: none !important; }

        .card {
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        .card h3 { margin: 0 0 8px; font-size: 18px; }
        .card .meta { color: #666; font-size: 14px; margin-bottom: 14px; word-break: break-all; }

        .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

        .open-link {
            display: inline-block;
            padding: 12px 22px;
            background: #1a73e8;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
        }
        .open-link:hover { background: #1662c4; }

        .save-btn {
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 6px;
            border: 1px solid #1a73e8;
            background: #fff;
            color: #1a73e8;
            cursor: pointer;
        }
        .save-btn:hover { background: #eef4fd; }
        .save-btn:active { background: #e1ecfb; }

        .hint { margin-top: 14px; font-size: 14px; color: #555; }
        .hint code { background: #eee; padding: 1px 5px; border-radius: 3px; }

        .secondary-btn {
            font: inherit;
            background: none;
            border: 1px solid #bbb;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <h2>Загрузите текстовый файл (.txt)</h2>
    <input type="file" id="fileInput" accept=".txt,.text,text/plain">
    <div id="status"></div>

    <div id="result" class="card" hidden>
        <h3>Статья готова</h3>
        <div class="meta" id="resultMeta"></div>

        <div class="actions">
            <!-- Обычная ссылка: новая вкладка открывается по клику, без разрешений на попапы -->
            <a id="openLink"
               class="open-link"
               href="#"
               target="_blank"
               rel="noopener noreferrer">Открыть статью в новой вкладке →</a>

            <!-- Сохранение готового HTML-файла на диск -->
            <button type="button" id="saveBtn" class="save-btn">Сохранить HTML-файл</button>
        </div>

        <div class="hint">
            После открытия вкладки дождитесь полной загрузки и откройте меню Chrome (⋮) —
            там появится пункт <code>Прослушать эту страницу</code>.
        </div>

        <button type="button" id="resetBtn" class="secondary-btn">Выбрать другой файл</button>
    </div>

    <script>
    (function () {
        const fileInput  = document.getElementById('fileInput');
        const statusEl   = document.getElementById('status');
        const result     = document.getElementById('result');
        const resultMeta = document.getElementById('resultMeta');
        const openLink   = document.getElementById('openLink');
        const saveBtn    = document.getElementById('saveBtn');
        const resetBtn   = document.getElementById('resetBtn');

        const CACHE_NAME = 'articles-v1';

        let currentBlobUrl  = null;
        let currentHtml     = null;   // готовый HTML статьи (для сохранения)
        let currentFileName = 'article.html';

        // ---------- Регистрация Service Worker ----------
        let swReady = null;
        if ('serviceWorker' in navigator) {
            swReady = navigator.serviceWorker
                .register('./sw.js')
                .then(() => navigator.serviceWorker.ready)
                .catch(err => {
                    console.warn('Service Worker не зарегистрирован:', err);
                    return null;
                });
        }

        // ---------- Утилиты ----------
        function setStatus(msg) { statusEl.textContent = msg; }

        function releaseBlob() {
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }
        }

        function makeId() {
            if (window.crypto && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : ((r & 0x3) | 0x8)).toString(16);
            });
        }

        function escapeHtml(s) {
            return s
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Безопасное имя файла из заголовка статьи.
        function makeFileName(title) {
            let base = String(title || 'article')
                .replace(/[\\/:*?"<>|\u0000-\u001F]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            // убираем точки/пробелы в конце — их не любят ФС Windows
            base = base.replace(/[. ]+$/g, '');
            if (!base) base = 'article';
            if (base.length > 80) base = base.slice(0, 80).trim();
            return base + '.html';
        }

        // ---------- Разбор исходного текста ----------
        function splitBlocks(text) {
            return text
                .replace(/^\uFEFF/, '')
                .split(/\r?\n[ \t]*\r?\n/)
                .map(block => block.replace(/^\s+|\s+$/g, ''))
                .filter(Boolean);
        }

        function parseHeading(line) {
            const m = /^(#{1,6})[ \t]+(\S.*)$/.exec(line);
            return m ? { level: m[1].length, text: m[2].trim() } : null;
        }

        // ---------- Генерация страницы статьи ----------
        function buildArticleHtml(text, sourceName) {
            const blocks = splitBlocks(text);
            if (!blocks.length) return null;

            const first = blocks[0];
            const firstIsSingleLine = first.indexOf('\n') === -1;
            const firstAsHeading = firstIsSingleLine ? parseHeading(first) : null;

            let title = '';
            let start = 0;

            if (firstAsHeading) {
                title = firstAsHeading.text;
                start = 1;
            } else if (firstIsSingleLine && first.length <= 120) {
                title = first;
                start = 1;
            } else if (sourceName) {
                title = sourceName.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
            }
            if (!title) title = 'Статья';

            const parts = [];
            let paragraphs = 0;
            let plainBody = '';

            for (let i = start; i < blocks.length; i++) {
                const block = blocks[i];
                const heading = block.indexOf('\n') === -1 ? parseHeading(block) : null;

                if (heading) {
                    const level = Math.min(Math.max(heading.level, 2), 4);
                    parts.push(`<h${level}>${escapeHtml(heading.text)}</h${level}>`);
                    continue;
                }

                const inner = escapeHtml(block).replace(/\r?\n/g, '<br>');
                parts.push(paragraphs === 0
                    ? `<p class="lead">${inner}</p>`
                    : `<p>${inner}</p>`);
                paragraphs++;
                plainBody += ' ' + block;
            }

            const words = plainBody.split(/\s+/).filter(Boolean).length;
            const minutes = Math.max(1, Math.round(words / 180));

            let description = plainBody.replace(/\s+/g, ' ').trim();
            if (description.length > 160) {
                description = description.slice(0, 160).replace(/\s+\S*$/, '') + '…';
            }
            if (!description) description = title;

            const metaLine = '≈ ' + minutes + ' мин чтения' +
                (paragraphs ? ' · абзацев: ' + paragraphs : '');

            const safeTitle = escapeHtml(title);
            const safeDesc = escapeHtml(description);
            const year = new Date().getFullYear();
            const source = sourceName
                ? 'Сгенерировано из файла: ' + escapeHtml(sourceName)
                : 'Статическая страница';

            return {
                count: paragraphs,
                title: title,
                html: `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="${safeDesc}">
<title>${safeTitle} — Читалка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light dark;
  --bg:#ffffff;
  --surface:#f7f8fa;
  --fg:#191c21;
  --muted:#66707d;
  --accent:#1a73e8;
  --rule:#e3e7ec;
  --max:44rem;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1116;
    --surface:#151920;
    --fg:#e6e9ee;
    --muted:#98a2b0;
    --accent:#7aa7f5;
    --rule:#232a33;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
.site-header{background:var(--surface);border-bottom:1px solid var(--rule)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand-mark{width:20px;height:20px;border-radius:6px;background:var(--accent)}
.site-nav{font-size:14px;color:var(--muted)}
main{padding:44px 0 56px}
.article-header{margin:0 0 32px;padding-bottom:24px;border-bottom:1px solid var(--rule)}
.kicker{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{margin:0 0 14px;font-size:clamp(1.7rem,4.4vw,2.4rem);line-height:1.18;letter-spacing:-.02em}
.byline{margin:0;font-size:14px;color:var(--muted)}
.article-body{font-size:1.0625rem}
.article-body p{margin:0 0 1.15em}
.article-body p.lead{font-size:1.18rem;line-height:1.55}
.article-body h2{margin:1.9em 0 .6em;font-size:1.4rem;line-height:1.3;letter-spacing:-.01em}
.article-body h3{margin:1.6em 0 .5em;font-size:1.18rem;line-height:1.35}
.article-body h4{margin:1.4em 0 .4em;font-size:1.05rem}
.site-footer{background:var(--surface);border-top:1px solid var(--rule);padding:22px 0;font-size:13px;color:var(--muted)}
.site-footer .wrap{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}
@media (max-width:600px){
  main{padding:28px 0 40px}
  .article-body{font-size:1.03rem}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <span class="brand"><span class="brand-mark" aria-hidden="true"></span>Читалка</span>
    <span class="site-nav">Статья</span>
  </div>
</header>

<main>
  <div class="wrap">
    <article class="article">
      <header class="article-header">
        <p class="kicker">Статья</p>
        <h1>${safeTitle}</h1>
        <p class="byline">${metaLine}</p>
      </header>
      <div class="article-body">
${parts.join('\n')}
      </div>
    </article>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© ${year} Читалка</span>
    <span>${source}</span>
  </div>
</footer>

</body>
</html>`
            };
        }

        // ---------- Сохранение файла ----------
        function downloadViaLink(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
            // Дадим браузеру время начать загрузку, потом освободим URL.
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }

        async function saveArticle() {
            if (!currentHtml) return;

            const fileName = currentFileName;
            const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });

            // 1. Нативный диалог сохранения (Chromium, secure context, жест пользователя).
            if (typeof window.showSaveFilePicker === 'function') {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{
                            description: 'HTML-файл',
                            accept: { 'text/html': ['.html', '.htm'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    setStatus('Файл сохранён: ' + (handle.name || fileName));
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        // Пользователь закрыл диалог — ничего не делаем.
                        return;
                    }
                    console.warn('showSaveFilePicker не сработал, используем скачивание:', err);
                }
            }

            // 2. Резерв — обычное скачивание.
            try {
                downloadViaLink(blob, fileName);
                setStatus('Файл сохранён: ' + fileName);
            } catch (err) {
                setStatus('Не удалось сохранить файл: ' + (err && err.message ? err.message : err));
            }
        }

        // ---------- Основной обработчик ----------
        fileInput.addEventListener('change', async function (event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            releaseBlob();
            currentHtml = null;
            currentFileName = 'article.html';
            result.hidden = true;
            setStatus('Чтение файла…');

            try {
                const buffer = await file.arrayBuffer();

                let text;
                try {
                    text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
                } catch (err) {
                    try {
                        text = new TextDecoder('windows-1251').decode(buffer);
                    } catch (err2) {
                        setStatus('Не удалось определить кодировку файла.');
                        return;
                    }
                }

                const article = buildArticleHtml(text, file.name);
                if (!article) {
                    setStatus('В файле не найден текст. Проверьте, что файл не пустой.');
                    return;
                }

                // Запоминаем для кнопки «Сохранить».
                currentHtml = article.html;
                currentFileName = makeFileName(article.title);

                let mode = 'blob';
                if (swReady) {
                    try {
                        await swReady;
                        const id = makeId();
                        const cache = await caches.open(CACHE_NAME);
                        const key = new URL('./__article/' + id, location.href).href;
                        await cache.put(key, new Response(article.html, {
                            headers: { 'Content-Type': 'text/html;charset=utf-8' }
                        }));
                        openLink.href = './article-' + id + '.html';
                        mode = 'sw';
                    } catch (err) {
                        console.warn('Не удалось подготовить статью через SW:', err);
                    }
                }

                if (mode !== 'sw') {
                    const blob = new Blob([article.html], { type: 'text/html;charset=utf-8' });
                    currentBlobUrl = URL.createObjectURL(blob);
                    openLink.href = currentBlobUrl;
                }

                resultMeta.textContent =
                    '«' + article.title + '»' +
                    ' · файл: ' + file.name +
                    ' · абзацев: ' + article.count +
                    ' · режим: ' + (mode === 'sw' ? 'service worker (.html)' : 'blob');

                result.hidden = false;
                setStatus('');
                openLink.focus();

            } catch (err) {
                setStatus('Не удалось прочитать файл: ' + (err && err.message ? err.message : err));
            }
        });

        saveBtn.addEventListener('click', saveArticle);

        resetBtn.addEventListener('click', function () {
            releaseBlob();
            currentHtml = null;
            currentFileName = 'article.html';
            result.hidden = true;
            fileInput.value = '';
            setStatus('');
            fileInput.focus();
        });

        window.addEventListener('pagehide', releaseBlob);
    })();
    </script>

    <!--
    Контракт с sw.js — без изменений.

    Кнопка «Сохранить HTML-файл»:
      • использует showSaveFilePicker (Chromium) для выбора места сохранения;
      • при отмене диалога ничего не происходит;
      • если API недоступен (Firefox/Safari) — обычное скачивание
        с именем из заголовка статьи.
    -->
</body>
</html>
