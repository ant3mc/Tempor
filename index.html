<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор озвучиваемой статьи</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; max-width: 800px; }
        #status { margin-top: 15px; color: #555; line-height: 1.5; }
        [hidden] { display: none !important; }

        .card {
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        .card h3 { margin: 0 0 8px; font-size: 18px; }
        .card .meta { color: #666; font-size: 14px; margin-bottom: 14px; word-break: break-all; }

        .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

        .save-btn {
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 6px;
            border: 1px solid #1a73e8;
            background: #fff;
            color: #1a73e8;
            cursor: pointer;
        }
        .save-btn:hover { background: #eef4fd; }
        .save-btn:active { background: #e1ecfb; }

        .secondary-btn {
            font: inherit;
            background: none;
            border: 1px solid #bbb;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            margin-top: 14px;
        }

        .option {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-top: 12px;
            cursor: pointer;
            user-select: none;
        }
        .option input { margin: 4px 0 0; flex: none; }
        .option code { font-size: 14px; background: #eee; padding: 1px 4px; border-radius: 3px; }
    </style>
</head>
<body>

    <h2>Загрузите текстовый файл (.txt или .md)</h2>
    <input type="file" id="fileInput" accept=".txt,.text,.md,text/plain,text/markdown">

    <label class="option">
        <input type="checkbox" id="strongToggle">
        <span>Заменять <code>**текст**</code> на <code>&lt;strong&gt;текст&lt;/strong&gt;</code></span>
    </label>

    <div id="status"></div>

    <div id="result" class="card" hidden>
        <h3>Статья готова</h3>
        <div class="meta" id="resultMeta"></div>

        <div class="actions">
            <!-- Сохранение готового HTML-файла на диск -->
            <button type="button" id="saveBtn" class="save-btn">Сохранить HTML-файл</button>
        </div>

        <button type="button" id="resetBtn" class="secondary-btn">Выбрать другой файл</button>
    </div>

    <script>
    (function () {
        const fileInput    = document.getElementById('fileInput');
        const statusEl     = document.getElementById('status');
        const result       = document.getElementById('result');
        const resultMeta   = document.getElementById('resultMeta');
        const saveBtn      = document.getElementById('saveBtn');
        const resetBtn     = document.getElementById('resetBtn');
        const strongToggle = document.getElementById('strongToggle');

        let currentHtml     = null;   // готовый HTML статьи (для сохранения)
        let currentFileName = 'article.html';
        let currentText     = null;   // исходный текст (для перегенерации)
        let currentSource   = '';     // имя исходного файла

        // ---------- Утилиты ----------
        function setStatus(msg) { statusEl.textContent = msg; }

        function escapeHtml(s) {
            return s
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // **текст** -> <strong>текст</strong> (в уже экранированной строке)
        function applyStrong(s) {
            return s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>');
        }

        // Безопасное имя файла из заголовка статьи.
        function makeFileName(title) {
            let base = String(title || 'article')
                .replace(/[\\/:*?"<>|\u0000-\u001F]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            // убираем точки/пробелы в конце — их не любят ФС Windows
            base = base.replace(/[. ]+$/g, '');
            if (!base) base = 'article';
            if (base.length > 80) base = base.slice(0, 80).trim();
            return base + '.html';
        }

        // ---------- Разбор исходного текста ----------
        function splitBlocks(text) {
            return text
                .replace(/^\uFEFF/, '')
                .split(/\r?\n[ \t]*\r?\n/)
                .map(block => block.replace(/^\s+|\s+$/g, ''))
                .filter(Boolean);
        }

        function parseHeading(line) {
            const m = /^(#{1,6})[ \t]+(\S.*)$/.exec(line);
            return m ? { level: m[1].length, text: m[2].trim() } : null;
        }

        // ---------- Генерация страницы статьи ----------
        function buildArticleHtml(text, sourceName, convertStrong) {
            const blocks = splitBlocks(text);
            if (!blocks.length) return null;

            const first = blocks[0];
            const firstIsSingleLine = first.indexOf('\n') === -1;
            const firstAsHeading = firstIsSingleLine ? parseHeading(first) : null;

            let title = '';
            let start = 0;

            if (firstAsHeading) {
                title = firstAsHeading.text;
                start = 1;
            } else if (firstIsSingleLine && first.length <= 120) {
                title = first;
                start = 1;
            } else if (sourceName) {
                title = sourceName.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
            }
            if (!title) title = 'Статья';

            const parts = [];
            let paragraphs = 0;
            let plainBody = '';

            for (let i = start; i < blocks.length; i++) {
                const block = blocks[i];
                const heading = block.indexOf('\n') === -1 ? parseHeading(block) : null;

                if (heading) {
                    const level = Math.min(Math.max(heading.level, 2), 4);
                    parts.push(`<h${level}>${escapeHtml(heading.text)}</h${level}>`);
                    continue;
                }

                let inner = escapeHtml(block);
                if (convertStrong) inner = applyStrong(inner);
                inner = inner.replace(/\r?\n/g, '<br>');

                parts.push(paragraphs === 0
                    ? `<p class="lead">${inner}</p>`
                    : `<p>${inner}</p>`);
                paragraphs++;
                plainBody += ' ' + block;
            }

            const words = plainBody.split(/\s+/).filter(Boolean).length;
            const minutes = Math.max(1, Math.round(words / 180));

            let description = plainBody.replace(/\s+/g, ' ').trim();
            if (description.length > 160) {
                description = description.slice(0, 160).replace(/\s+\S*$/, '') + '…';
            }
            if (!description) description = title;

            const metaLine = '≈ ' + minutes + ' мин чтения' +
                (paragraphs ? ' · абзацев: ' + paragraphs : '');

            const safeTitle = escapeHtml(title);
            const safeDesc = escapeHtml(description);
            const year = new Date().getFullYear();
            const source = sourceName
                ? 'Сгенерировано из файла: ' + escapeHtml(sourceName)
                : 'Статическая страница';

            return {
                count: paragraphs,
                title: title,
                html: `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="${safeDesc}">
<title>${safeTitle} — Читалка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light dark;
  --fs: 48px;        /* размер шрифта всей страницы */
  --pad-left: 6px;   /* единственный отступ — небольшой левый */
  --bg:#ffffff;
  --fg:#191c21;
  --muted:#66707d;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1116; --fg:#e6e9ee; --muted:#98a2b0; }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--fs);
  line-height:1.12;
  padding:0 0 0 var(--pad-left);
  text-align:left;
  /* агрессивные переносы: по слогам плюс разрыв любого длинного слова */
  hyphens:auto;
  -webkit-hyphens:auto;
  overflow-wrap:anywhere;
  word-break:break-word;
}
h1,h2,h3,h4,p,span,div,header,main,article,footer{
  margin:0;
  padding:0;
  max-width:none;
  font-size:var(--fs);
  line-height:1.12;
  font-weight:400;
}
h1,h2,h3,h4{font-weight:700}
.wrap{width:auto;max-width:none;margin:0;padding:0}
.site-header,.site-footer{background:none;border:0}
.brand,.site-nav,.kicker,.byline,.site-footer{color:var(--muted)}
.article-body p.lead{font-size:var(--fs);line-height:1.12}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap"><span class="brand">Читалка</span> <span class="site-nav">Статья</span></div>
</header>

<main>
  <div class="wrap">
    <article class="article">
      <header class="article-header">
        <p class="kicker">Статья</p>
        <h1>${safeTitle}</h1>
        <p class="byline">${metaLine}</p>
      </header>
      <div class="article-body">
${parts.join('\n')}
      </div>
    </article>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap"><span>© ${year} Читалка</span> <span>${source}</span></div>
</footer>

</body>
</html>`
            };
        }

        // ---------- Сохранение файла ----------
        function downloadViaLink(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
            // Дадим браузеру время начать загрузку, потом освободим URL.
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }

        async function saveArticle() {
            if (!currentHtml) return;

            const fileName = currentFileName;
            const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });

            // 1. Нативный диалог сохранения (Chromium, secure context, жест пользователя).
            if (typeof window.showSaveFilePicker === 'function') {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{
                            description: 'HTML-файл',
                            accept: { 'text/html': ['.html', '.htm'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    setStatus('Файл сохранён: ' + (handle.name || fileName));
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        // Пользователь закрыл диалог — ничего не делаем.
                        return;
                    }
                    console.warn('showSaveFilePicker не сработал, используем скачивание:', err);
                }
            }

            // 2. Резерв — обычное скачивание.
            try {
                downloadViaLink(blob, fileName);
                setStatus('Файл сохранён: ' + fileName);
            } catch (err) {
                setStatus('Не удалось сохранить файл: ' + (err && err.message ? err.message : err));
            }
        }

        // ---------- Основной обработчик ----------
        fileInput.addEventListener('change', async function (event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            currentHtml = null;
            currentFileName = 'article.html';
            currentText = null;
            currentSource = '';
            result.hidden = true;
            setStatus('Чтение файла…');

            try {
                const buffer = await file.arrayBuffer();

                let text;
                try {
                    text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
                } catch (err) {
                    try {
                        text = new TextDecoder('windows-1251').decode(buffer);
                    } catch (err2) {
                        setStatus('Не удалось определить кодировку файла.');
                        return;
                    }
                }

                const article = buildArticleHtml(text, file.name, strongToggle.checked);
                if (!article) {
                    setStatus('В файле не найден текст. Проверьте, что файл не пустой.');
                    return;
                }

                // Запоминаем для кнопки «Сохранить» и для перегенерации.
                currentText = text;
                currentSource = file.name;
                currentHtml = article.html;
                currentFileName = makeFileName(article.title);

                resultMeta.textContent =
                    '«' + article.title + '»' +
                    ' · файл: ' + file.name +
                    ' · абзацев: ' + article.count;

                result.hidden = false;
                setStatus('');
                saveBtn.focus();

            } catch (err) {
                setStatus('Не удалось прочитать файл: ' + (err && err.message ? err.message : err));
            }
        });

        // Переключение настройки: если файл уже загружен — пересобираем статью.
        strongToggle.addEventListener('change', function () {
            if (currentText === null) return;

            const article = buildArticleHtml(currentText, currentSource, strongToggle.checked);
            if (!article) return;

            currentHtml = article.html;
            currentFileName = makeFileName(article.title);
            setStatus('');
        });

        saveBtn.addEventListener('click', saveArticle);

        resetBtn.addEventListener('click', function () {
            currentHtml = null;
            currentFileName = 'article.html';
            currentText = null;
            currentSource = '';
            result.hidden = true;
            fileInput.value = '';
            setStatus('');
            fileInput.focus();
        });
    })();
    </script>

    <!--
    Открытие в новой вкладке удалено вместе с service worker, кэшем,
    blob-предпросмотром и подсказкой про меню Chrome. Файл sw.js не нужен.

    Поддерживаются файлы .txt и .md — обработка одинаковая.

    Кнопка «Сохранить HTML-файл»:
      • использует showSaveFilePicker (Chromium) для выбора места сохранения;
      • при отмене диалога ничего не происходит;
      • если API недоступен (Firefox/Safari) — обычное скачивание
        с именем из заголовка статьи.

    Галочка «Заменять **текст** на <strong>текст</strong>»:
      • учитывается при сборке статьи; если файл уже загружен,
        переключение галочки сразу пересобирает готовый HTML.
    -->
</body>
</html>
