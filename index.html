<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя озвучиваемая статья</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #article-container { border: 1px solid #ccc; padding: 15px; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Загрузите текстовый файл (.txt)</h2>
    <input type="file" id="fileInput" accept=".txt">
    
    <!-- Контейнер, в который будет помещен текст -->
    <div id="article-container" class="hidden">
        <!-- Именно этот элемент Chrome будет искать для озвучки -->
        <article class="read-aloud" id="read-aloud-article" lang="ru">
            <!-- Содержимое будет вставлено сюда -->
        </article>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {
                const textContent = e.target.result;
                const articleElement = document.getElementById('read-aloud-article');
                const container = document.getElementById('article-container');

                // Очищаем предыдущее содержимое и вставляем новое
                articleElement.innerHTML = ''; 
                
                // Разбиваем текст на абзацы для лучшей структуры
                const paragraphs = textContent.split(/\r?\n\r?\n/);
                paragraphs.forEach(paraText => {
                    if (paraText.trim() !== '') {
                        const p = document.createElement('p');
                        p.textContent = paraText.trim();
                        articleElement.appendChild(p);
                    }
                });

                // Показываем контейнер с текстом
                container.classList.remove('hidden');
            };

            // Читаем файл как текст
            reader.readAsText(file);
        });
    </script>
</body>
</html>
